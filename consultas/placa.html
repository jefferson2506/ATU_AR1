<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Buscador de placas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>

        /* ==============================
           CUADRÍCULA DE RESULTADOS
           SIEMPRE 3 COLUMNAS
           ============================== */

        .results-grid {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
        }

        /* Cada placa */

        .result-btn {
            width: 100%;
            min-width: 0;
            min-height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 16px;
            font-weight: bold;

            border-radius: 8px;
            border: none;

            padding: 10px 5px;

            word-break: break-word;
        }

        /* En celulares también mantiene 3 columnas */

        @media (max-width: 576px) {

            .results-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }

            .result-btn {
                min-height: 55px;
                font-size: 13px;
                padding: 8px 3px;
            }

        }

        /* Mensaje cuando no hay resultados */

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px;
            color: #aaa;
        }

    </style>

</head>


<body class="bg-dark text-light">


<header class="container py-4">

    <h1 class="text-info fw-bold">
        BUSCADOR DE PLACAS
    </h1>

    <p class="text-light mb-0">
        Carga tu Excel y busca por número o por placa
    </p>

</header>


<main class="container bg-dark border border-secondary p-4 rounded shadow-sm d-flex flex-column gap-3">


    <!-- BOTÓN PARA IR AL BUSCADOR DE CONDUCTORES -->

    <a class="btn btn-info text-dark fw-bold"
       href="conductor.html">

        IR A BUSCADOR DE CONDUCTORES

    </a>


    <!-- CARGAR EXCEL -->

    <div class="card bg-dark text-light border-secondary p-3">

        <div class="d-flex align-items-center gap-2 flex-wrap">

            <label class="btn btn-info text-dark fw-bold"
                   for="fileInput">

                ELEGIR EXCEL

            </label>

            <input
                class="visually-hidden"
                type="file"
                id="fileInput"
                accept=".xlsx,.xls,.csv">


            <select
                class="form-select bg-dark text-light border-secondary w-auto"
                id="sheetSelect">

            </select>

        </div>


        <div class="text-white-50 small mt-2"
             id="fileStatus">

            Cargando conductor.xlsx...

        </div>


        <div class="text-white-50 small mt-1"
             id="statRow">

        </div>

    </div>


    <!-- BUSCADOR -->

    <div class="card bg-dark text-light border-secondary p-3">

        <div>

            <input
                class="form-control form-control-lg bg-dark text-light border-secondary"
                type="text"
                id="searchInput"
                placeholder="Escribe un número o una placa..."
                autocomplete="off"
                disabled>

        </div>


        <div class="text-white-50 small mt-2">

            Toca una placa para copiar su información.

        </div>

    </div>


    <!-- RESULTADOS -->

    <div
        class="text-info fw-bold"
        id="resultsLabel"
        style="display:none;">

        Resultados

    </div>


    <!-- AQUÍ APARECEN LAS PLACAS -->

    <div
        class="results-grid row row-cols-3 g-2"
        id="results">

    </div>


</main>


<!-- MENSAJE DE COPIADO -->

<div
    class="toast position-fixed bottom-0 start-50 translate-middle-x mb-3 bg-info text-dark"
    id="toast">

</div>



<script>

(function() {


    const fileInput =
        document.getElementById('fileInput');

    const sheetSelect =
        document.getElementById('sheetSelect');

    const fileStatus =
        document.getElementById('fileStatus');

    const statRow =
        document.getElementById('statRow');

    const searchInput =
        document.getElementById('searchInput');

    const resultsEl =
        document.getElementById('results');

    const resultsLabel =
        document.getElementById('resultsLabel');

    const toast =
        document.getElementById('toast');


    let workbook = null;

    let records = [];



    /* ==============================
       MOSTRAR MENSAJE
       ============================== */

    function showToast(msg) {

        toast.textContent = msg;

        toast.classList.add('show');

        clearTimeout(showToast._t);

        showToast._t = setTimeout(() => {

            toast.classList.remove('show');

        }, 1400);

    }



    /* ==============================
       COPIAR TEXTO
       ============================== */

    function copyText(text) {

        try {

            if (
                navigator.clipboard &&
                navigator.clipboard.writeText
            ) {

                navigator.clipboard.writeText(text);

            } else {

                const ta =
                    document.createElement('textarea');

                ta.value = text;

                ta.style.position = 'fixed';

                ta.style.opacity = '0';

                document.body.appendChild(ta);

                ta.select();

                document.execCommand('copy');

                document.body.removeChild(ta);

            }

            showToast('Copiado: ' + text);

        } catch (e) {

            showToast('No se pudo copiar');

        }

    }



    /* ==============================
       FORMATEAR BÚSQUEDA
       ============================== */

    function formatPlateInput(value) {

        let cleaned =
            value
                .toUpperCase()
                .replace(/[^A-Z0-9]/g, '');


        if (/^\d+$/.test(cleaned)) {

            return cleaned;

        }


        if (cleaned.length > 3) {

            return (
                cleaned.slice(0, 3) +
                '-' +
                cleaned.slice(3, 7)
            );

        }


        return cleaned;

    }



    /* ==============================
       FORMATEAR PLACA
       ============================== */

    function formatearPlaca(valor) {

        const caracteres =
            String(valor)
                .toUpperCase()
                .replace(/[^A-Z0-9]/g, '');


        if (caracteres.length < 6) {

            return caracteres;

        }


        return (
            caracteres.slice(0, 3) +
            '-' +
            caracteres.slice(-3)
        );

    }



    /* ==============================
       CARGAR HOJA DE EXCEL
       ============================== */

    function loadSheet(sheetName) {

        const ws =
            workbook.Sheets[sheetName];


        let rows =
            XLSX.utils.sheet_to_json(
                ws,
                { header: 1 }
            );


        /* Quitar encabezado */

        if (
            rows.length > 0 &&
            rows[0][0] &&
            rows[0][0]
                .toString()
                .toLowerCase()
                .includes('cod')
        ) {

            rows.shift();

        }


        records = [];


        const vistos = new Set();


        /* Recorrer registros */

        for (const row of rows) {


            /*
             Columna D = PLACA
             Columna E = NÚMERO
            */


            if (
                !row ||
                row.length < 4 ||
                !row[3]
            ) {

                continue;

            }


            const plate =
                formatearPlaca(row[3]);


            if (!plate) {

                continue;

            }


            let num = '';


            if (
                row[4] !== undefined &&
                row[4] !== null &&
                String(row[4]).trim() !== ''
            ) {

                const candidato =
                    String(row[4]).trim();


                if (/\d/.test(candidato)) {

                    num = candidato;

                }

            }


            const clave =
                plate + '|' + num;


            if (vistos.has(clave)) {

                continue;

            }


            vistos.add(clave);


            records.push({

                num: num,

                plate: plate

            });

        }


        statRow.textContent =
            records.length +
            ' placas cargadas de la hoja "' +
            sheetName +
            '"';


        searchInput.disabled =
            records.length === 0;


        searchInput.value = '';


        renderResults('');

    }



    /* ==============================
       PROCESAR EXCEL
       ============================== */

    function procesarWorkbook(
        data,
        nombreArchivo
    ) {

        workbook =
            XLSX.read(
                data,
                { type: 'array' }
            );


        fileStatus.textContent =
            'Archivo: ' +
            nombreArchivo;


        sheetSelect.innerHTML = '';


        workbook.SheetNames.forEach(name => {

            const opt =
                document.createElement('option');


            opt.value = name;

            opt.textContent = name;


            sheetSelect.appendChild(opt);

        });


        sheetSelect.style.display =
            workbook.SheetNames.length > 1
                ? 'inline-block'
                : 'none';


        loadSheet(
            workbook.SheetNames[0]
        );

    }



    /* ==============================
       CARGAR AUTOMÁTICAMENTE
       ============================== */

    function cargarConductorAutomatico() {

        fetch('conductor.xlsx')

            .then(function(respuesta) {

                if (!respuesta.ok) {

                    throw new Error(
                        'No se encontró conductor.xlsx (HTTP ' +
                        respuesta.status +
                        ')'
                    );

                }

                return respuesta.arrayBuffer();

            })


            .then(function(buffer) {

                procesarWorkbook(
                    new Uint8Array(buffer),
                    'conductor.xlsx'
                );

            })


            .catch(function(error) {

                fileStatus.textContent =
                    'No se pudo cargar conductor.xlsx automáticamente. ' +
                    'Selecciónalo manualmente.';

                console.log(error);

            });

    }



    /* ==============================
       SELECCIONAR EXCEL MANUALMENTE
       ============================== */

    fileInput.addEventListener(
        'change',
        function(e) {

            const file =
                e.target.files[0];


            if (!file) return;


            fileStatus.textContent =
                'Leyendo ' +
                file.name +
                '...';


            const reader =
                new FileReader();


            reader.onload =
                function(evt) {

                    try {

                        procesarWorkbook(
                            new Uint8Array(
                                evt.target.result
                            ),
                            file.name
                        );


                        searchInput.focus();

                    } catch (err) {

                        fileStatus.textContent =
                            'Error al leer el archivo: ' +
                            err.message;

                    }

                };


            reader.readAsArrayBuffer(file);

        }
    );



    /* ==============================
       CAMBIAR HOJA
       ============================== */

    sheetSelect.addEventListener(
        'change',
        function() {

            loadSheet(
                sheetSelect.value
            );

        }
    );



    /* ==============================
       MOSTRAR RESULTADOS
       ============================== */

    function renderResults(query) {


        resultsEl.innerHTML = '';


        const rawQ =
            query.trim().toUpperCase();


        const cleanQ =
            rawQ.replace(/-/g, '');


        if (
            !records.length ||
            !rawQ
        ) {

            resultsLabel.style.display =
                'none';

            return;

        }



        /* Buscar coincidencias */

        const matches =
            records
                .filter(r => {

                    const cleanNum =
                        r.num
                            .toUpperCase()
                            .replace(/-/g, '');


                    const cleanPlate =
                        r.plate
                            .toUpperCase()
                            .replace(/-/g, '');


                    return (
                        cleanNum.includes(cleanQ) ||
                        cleanPlate.includes(cleanQ)
                    );

                })
                .slice(0, 60);



        /* Sin resultados */

        if (!matches.length) {

            resultsLabel.style.display =
                'block';


            resultsLabel.textContent =
                'Resultados';


            const empty =
                document.createElement('div');


            empty.className =
                'empty';


            empty.textContent =
                'Sin coincidencias para "' +
                query +
                '"';


            resultsEl.appendChild(empty);


            return;

        }



        /* Cantidad de resultados */

        resultsLabel.style.display =
            'block';


        resultsLabel.textContent =
            matches.length +
            (
                matches.length === 1
                    ? ' resultado'
                    : ' resultados'
            );



        /* ==============================
           CREAR BOTONES DE PLACAS
           ============================== */

        matches.forEach(r => {


            const btn =
                document.createElement('button');


            btn.type = 'button';


            btn.className =
                'result-btn btn btn-primary text-white d-flex flex-column gap-1 py-3';



            /*
             Si existe número:
             se copia el número.

             Si no existe:
             se copia la placa.
            */

            const tieneNumero =
                !!r.num;


            const copyValue =
                tieneNumero
                    ? r.num
                    : r.plate;



            /* Mostrar la placa y el valor de la columna E si existe */

            const placa =
                document.createElement('span');

            placa.textContent =
                r.plate;

            btn.appendChild(placa);

            if (tieneNumero) {

                const numero =
                    document.createElement('span');

                numero.className =
                    'small text-info';

                numero.textContent =
                    'N° ' + r.num;

                btn.appendChild(numero);

            }



            /* Copiar al tocar */

            btn.addEventListener(
                'click',
                function() {


                    copyText(copyValue);


                    btn.classList.remove(
                        'btn-primary'
                    );


                    btn.classList.add(
                        'btn-success'
                    );


                    const contenidoOriginal =
                        btn.innerHTML;


                    btn.textContent =
                        '¡Copiado!';



                    setTimeout(() => {

                        btn.classList.remove(
                            'btn-success'
                        );


                        btn.classList.add(
                            'btn-primary'
                        );


                        btn.innerHTML =
                            contenidoOriginal;

                    }, 1000);

                }
            );


            resultsEl.appendChild(btn);

        });

    }



    /* ==============================
       BUSCAR
       ============================== */

    searchInput.addEventListener(
        'input',
        function() {


            const formatted =
                formatPlateInput(
                    searchInput.value
                );


            searchInput.value =
                formatted;


            renderResults(
                formatted
            );

        }
    );



    /* ==============================
       INICIAR
       ============================== */

    window.addEventListener(
        'load',
        cargarConductorAutomatico
    );


})();

</script>


</body>

</html>
