<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buscador de Conductores</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body class="bg-dark text-light p-3">

<main class="container bg-dark border border-secondary p-4 rounded shadow-sm">

<h2 class="text-center text-info mb-3">BUSCADOR DE CONDUCTORES</h2>

<a class="btn btn-info text-dark d-block mb-3 fw-bold" href="placa.html">IR A BUSCADOR DE PLACAS</a>

<!-- Cargar Excel -->
<input 
    type="file" 
    id="excel" 
    class="form-control form-control-lg bg-dark text-white border-secondary mb-3"
    accept=".xlsx"
>

<!-- Buscador -->
<input 
    type="text" 
    id="buscar" 
    class="form-control form-control-lg bg-dark text-white border-secondary mb-3"
    placeholder="Buscar por código o nombre..."
    disabled
>

<!-- Resultados -->
<div id="resultado" class="mt-2"></div>

</main>


<script>

let datos = [];

function cargarDatosDesdeExcel(buffer, origen){

    try {

        const data = new Uint8Array(buffer);

        const libro = XLSX.read(data, {
            type: "array"
        });

        const hoja = libro.Sheets[libro.SheetNames[0]];

        datos = XLSX.utils.sheet_to_json(hoja, {
            header: 1
        });

        if(datos.length > 0 && datos[0][0] && datos[0][0].toString().toLowerCase().includes("cod")){
            datos.shift();
        }

        document.getElementById("buscar").disabled = false;

        if(origen === "manual"){
            alert("Excel cargado correctamente");
        }

    } catch (e) {

        alert("Error al leer el Excel: " + e.message);

    }

}


// ================================
// CARGAR EXCEL
// ================================

document.getElementById("excel").addEventListener("change", function(e){

    const archivo = e.target.files[0];

    if(!archivo) return;

    const lector = new FileReader();

    lector.onload = function(ev){

        cargarDatosDesdeExcel(ev.target.result, "manual");

    };

    lector.readAsArrayBuffer(archivo);

});

window.addEventListener("load", function(){

    fetch("conductor.xlsx")
        .then(function(respuesta){
            if(!respuesta.ok){
                throw new Error("No se encontró conductor.xlsx (HTTP " + respuesta.status + ")");
            }
            return respuesta.arrayBuffer();
        })
        .then(function(buffer){
            cargarDatosDesdeExcel(buffer, "automático");
        })
        .catch(function(error){
            alert("No se pudo cargar conductor.xlsx automáticamente. Cargue el archivo manualmente.");
            console.log(error);
        });

});


// ================================
// BUSCAR
// ================================

document.getElementById("buscar").addEventListener("input", function(){

    let texto = this.value.toUpperCase().trim();

    let html = "";

    if(texto === ""){

        document.getElementById("resultado").innerHTML = "";

        return;

    }

    let encontrados = 0;


    for(let i = 0; i < datos.length; i++){

        let codigo = (datos[i][0] || "").toString();

        let nombre = (datos[i][1] || "").toString().toUpperCase();

        let dni = (datos[i][2] || "").toString();


        if(
            codigo.toUpperCase().includes(texto) ||
            nombre.includes(texto)
        ){

            html += `
                <div class="card bg-dark text-white border-secondary shadow-sm mb-3">
                    <div class="card-body">

                    <div class="text-info fs-4 fw-bold">
                        ${codigo}
                    </div>

                    <div class="fs-5 mt-1">
                        ${nombre}
                    </div>

                    <div class="mt-2">
                        <b>DNI:</b> ${dni}
                    </div>

                    <button 
                        class="btn btn-info text-dark mt-2 fw-bold"
                        onclick="copiarCodigo('${codigo.replace(/'/g, "\\'")}', this)"
                    >
                        COPIAR CÓDIGO
                    </button>

                    </div>
                </div>
            `;

            encontrados++;

            // Máximo 30 resultados
            if(encontrados >= 30) break;

        }

    }


    if(html === ""){

        html = `
            <div class="alert alert-info text-center">
                No se encontraron resultados
            </div>
        `;

    }


    document.getElementById("resultado").innerHTML = html;

});


// ================================
// COPIAR SOLO EL CÓDIGO
// ================================

function copiarCodigo(codigo, boton){

    navigator.clipboard.writeText(codigo).then(function(){

        boton.innerHTML = "COPIADO";

        boton.classList.remove("btn-info", "text-dark");
        boton.classList.add("btn-success");


        setTimeout(function(){

            boton.innerHTML = "COPIAR CÓDIGO";

            boton.classList.remove("btn-success");
            boton.classList.add("btn-info", "text-dark");

        }, 1500);


    }).catch(function(){

        alert("No se pudo copiar el código");

    });

}

</script>

</body>
</html>
