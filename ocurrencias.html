<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocurrencias ATU</title>
<link rel="stylesheet" href="atu.css">
<link rel="stylesheet" href="css/ocurrencias.css">
</head>
<body>
  <div class="dashboard">
    <a href="atu.html">📋 Reporte</a>
    <a href="vias.html">🛣️ Vías</a>
    <a href="Incidentes.html">⚠️ Incidentes</a>
  </div>

  <div class="nav-tabs">
    <a href="Incidentes.html">Incidentes</a>
    <a href="ocurrencias.html" class="activo">Ocurrencias</a>
  </div>

  <div class="cov-card">
    <span>👮 COV actual: <strong id="covNameLabel">Sin registrar</strong></span>
    <button onclick="mostrarModalCov()">Cambiar</button>
  </div>

  <div class="cov-modal" id="covModal">
    <div class="cov-panel">
      <h3>Registrar COV</h3>
      <label for="covInput">Nombre del COV</label>
      <input id="covInput" placeholder="Ej: Ari Hilasaca Jefferson">
      <button onclick="guardarCovDesdeModal()">Guardar</button>
    </div>
  </div>

  <div class="card">
    <h1>📍 Ocurrencias</h1>
    <p>Genera reportes de ocurrencias con los datos detectados.</p>
  </div>

  <div class="card">
    <label><b>Tipo de Reporte</b></label>
    <div class="type-switch">
      <button class="activo" onclick="cambiarTipo('trafico')">🚥 Tráfico</button>
      <button onclick="cambiarTipo('presencia')">👮 P. Despacho</button>
      <button onclick="cambiarTipo('recaudo')">💰 P. Recaudo</button>
    </div>
  </div>

  <div id="seccion-trafico" class="card">
    <label>👮 COV</label>
    <input id="cov" placeholder="Nombre del COV">

    <div class="grid">
      <div>
        <label>🚏 Paradero</label>
        <input id="paradero" value="Canaval y Moreyra">
      </div>
      <div>
        <label>🔁 Sentido</label>
        <select id="sentido">
          <option value="A">A</option>
          <option value="B" selected>B</option>
        </select>
      </div>
    </div>

    <label>🔢 Cambios de semáforo con preferencia</label>
    <input type="range" id="semaforos" min="1" max="10" value="2" oninput="actualizar()">
    <span id="valor" style="color:#ff9800;font-size:18px;font-weight:bold;">2</span>

    <label>📝 Suceso</label>
    <textarea id="suceso" placeholder="Escribe el detalle de la ocurrencia..."></textarea>
  </div>

  <div id="seccion-presencia" class="card seccion-oculta">
    <label>👮 COV</label>
    <input id="cov-presencia" placeholder="Nombre del COV">

    <div class="grid">
      <div>
        <label>🚏 Paradero</label>
        <input id="paradero-presencia" value="Canaval y Moreyra">
      </div>
      <div>
        <label>🔁 Sentido</label>
        <select id="sentido-presencia">
          <option value="A">A</option>
          <option value="B" selected>B</option>
        </select>
      </div>
    </div>

    <label><b>¿Presencia de Personal de Despacho?</b></label>
    <div class="grid">
      <button id="btn-si" class="btn" onclick="cambiarPresencia(true)" style="background:#4caf50;">✅ SÍ HAY</button>
      <button id="btn-no" class="btn" onclick="cambiarPresencia(false)">❌ NO HAY</button>
    </div>
    <div id="presencia-estado" style="text-align:center;margin:10px 0;font-size:16px;font-weight:bold;color:#7ec8ff;">Selecciona una opción</div>
  </div>

  <div id="seccion-recaudo" class="card seccion-oculta">
    <label>👮 COV</label>
    <input id="cov-recaudo" placeholder="Nombre del COV">

    <div class="grid">
      <div>
        <label>🚏 Paradero</label>
        <input id="paradero-recaudo" value="Canaval y Moreyra">
      </div>
      <div>
        <label>🔁 Sentido</label>
        <select id="sentido-recaudo">
          <option value="A">A</option>
          <option value="B" selected>B</option>
        </select>
      </div>
    </div>

    <label><b>¿Presencia de Personal de Recaudo?</b></label>
    <div class="grid">
      <button id="btn-recaudo-si" class="btn" onclick="cambiarRecaudo(true)" style="background:#4caf50;">✅ SÍ HAY</button>
      <button id="btn-recaudo-no" class="btn" onclick="cambiarRecaudo(false)">❌ NO HAY</button>
    </div>
    <div id="recaudo-estado" style="text-align:center;margin:10px 0;font-size:16px;font-weight:bold;color:#7ec8ff;">Selecciona una opción</div>
  </div>

  <div class="card">
    <button class="btn" onclick="generarReporte()">📋 Generar reporte</button>
    <button class="btn secondary" onclick="copiarReporte()">📋 Copiar reporte</button>
  </div>

  <div class="card">
    <div id="estadoTexto" style="margin-bottom:8px;color:#7ec8ff;">Listo para generar</div>
    <div class="output" id="resultado">Aquí aparecerá el reporte generado.</div>
  </div>

<script src="js/ocurrencias.js"></script>
</body>
</html>
