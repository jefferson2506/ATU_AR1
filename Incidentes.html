<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incidencia CCSJL</title>
<link rel="stylesheet" href="atu.css">
<link rel="stylesheet" href="css/Incidentes.css">
</head>

<body>

<div class="dashboard">
    <a href="atu.html">📋 Reporte</a>
    <a href="vias.html">🛣️ Vías</a>
    <a href="Incidentes.html" class="activo">⚠️ Incidentes</a>
</div>

<div class="nav-tabs">
    <a href="Incidentes.html" class="activo">Incidentes</a>
    <a href="ocurrencias.html">Ocurrencias</a>
</div>

<div class="container">

<div id="inicio" class="oculto">

<h2>Nombre del COV</h2>

<input
id="cov"
placeholder="Ingrese nombre del COV">

<button id="continuar">
Continuar
</button>

</div>

<div id="menu">

<h2>🚦 INCIDENCIA</h2>

<p style="color:#cbd5e1;font-size:12px;margin-bottom:12px;">👮 COV: <strong id="covMostrado">Cargando...</strong> <button id="btnCambiarCov" style="padding:4px 8px;font-size:11px;margin-left:8px;">Cambiar</button></p>

<div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr;">

<div>
<label>Sentido</label>
<select id="sentido">
<option>A</option>
<option>B</option>
</select>
</div>

<div>
<label>Ruta</label>
<select id="ruta">
<option>405</option>
<option>SE09</option>
</select>
</div>

<div>
<label>Placa</label>
<input
id="placa"
maxlength="7"
placeholder="AUZ-922">
</div>

<div>
<label>Servicio</label>
<input
id="servicio"
type="number">
</div>

<div>
<label>N° Usuarios</label>
<input
id="usuarios"
type="number">
</div>

</div>

<div class="botones">

<button id="generar">
Generar Reporte
</button>

<button id="copiar">
Copiar Reporte
</button>

</div>

<textarea
id="resultado"
readonly></textarea>

</div>

</div>

<script src="js/Incidentes.js"></script>
</body>
</html>
